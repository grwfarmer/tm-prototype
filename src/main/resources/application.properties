spring.application.name=tm-prototype

# Local defaults. Inside Docker Compose these are overridden by environment variables.
spring.datasource.url=jdbc:postgresql://localhost:5432/tm
spring.datasource.username=tm
spring.datasource.password=tm_dev_password

# Flyway owns the schema, so Hibernate must never change it
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Return errors in the standard RFC 9457 "problem details" format
spring.mvc.problemdetails.enabled=true

# Health endpoints, used by Kubernetes probes on Day 2
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# Monitoring rule settings
tm.rules.large-amount.threshold=10000
