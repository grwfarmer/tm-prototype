services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tm
      POSTGRES_USER: tm
      POSTGRES_PASSWORD: tm_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tm -d tm"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tm
      SPRING_DATASOURCE_USERNAME: tm
      SPRING_DATASOURCE_PASSWORD: tm_dev_password
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
